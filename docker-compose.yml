# ============================================================
# AgriDialectAgent Docker Compose
# 一键启动: docker-compose up -d
# ============================================================
version: "3.8"

services:
  # -------------------- FastAPI 后端 --------------------
  api:
    build: .
    container_name: agri-api
    ports:
      - "8000:8000"
    environment:
      - FASTAPI_HOST=0.0.0.0
      - FASTAPI_PORT=8000
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=INFO
    volumes:
      - ./data:/app/data
      - ./vector_db:/app/vector_db
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_started
    restart: unless-stopped

  # -------------------- Redis 缓存 --------------------
  redis:
    image: redis:7-alpine
    container_name: agri-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # -------------------- Streamlit 前端 --------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: agri-frontend
    ports:
      - "8501:8501"
    environment:
      - API_BASE=http://api:8000
    depends_on:
      - api
    restart: unless-stopped

volumes:
  redis_data:
